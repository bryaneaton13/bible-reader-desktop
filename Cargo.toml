[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.2.0"
publish = false
license = "MIT"
repository = "https://github.com/bryaneaton13/bible-reader-desktop"

[workspace.dependencies]
bible-core = { path = "crates/bible-core" }
bible-store = { path = "crates/bible-store" }
bible-youversion = { path = "crates/bible-youversion" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
gpui-kit = "=0.7.1"

# gpui-tray 0.1.4 with a macOS patch: tray icons are @2x template images
# (vendor/gpui-tray/src/backend/macos.rs, `native_image`).
[patch.crates-io]
gpui-tray = { path = "vendor/gpui-tray" }
